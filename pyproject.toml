[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlab-platform"
version = "0.1.0"
description = "Evidence-first evaluation and observability for AI agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4", "redis>=5,<7", "celery[redis]>=5.4,<6",
  "httpx>=0.27,<1", "jsonschema>=4.23,<5", "typer>=0.12,<1",
  "python-dotenv>=1,<2", "reportlab>=4,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1", "pytest-cov>=6,<8"]

[project.scripts]
agentlab = "agentlab.cli:app"

[tool.setuptools.packages.find]
where = ["packages", "apps/api"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations/versions"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
